<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вхід | BestPizza</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles/styles.css') }}">
</head>
<body>

<div class="register-page">

    <h1>🍕 Вхід до акаунта</h1>

    {% if error %}
        <p class="error-message" role="alert">
            {{ error }}
        </p>
    {% endif %}

    <form
        class="register-form"
        method="POST"
        action="{{ url_for('login') }}">

        <div class="form-group">
            <label for="username">
                Логін
            </label>

            <input
                id="username"
                type="text"
                name="username"
                value="{{ request.form.get('username', '') }}"
                placeholder="Введіть логін"
                required
                autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">
                Пароль
            </label>

            <input
                id="password"
                type="password"
                name="password"
                placeholder="Введіть пароль"
                required
                autocomplete="current-password">
        </div>

        <button
            type="submit"
            class="submit-register-btn">
            Увійти
        </button>

    </form>


    <div class="register-links">

        <p>
            Ще немає акаунта?
        </p>

        <a
            href="{{ url_for('register') }}"
            class="secondary-button">
            Зареєструватися
        </a>

        <a
            href="{{ url_for('index') }}"
            class="back-link">
            ← Повернутися до меню
        </a>

    </div>

</div>

</body>
</html>
